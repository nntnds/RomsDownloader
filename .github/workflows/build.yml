name: Android Release Build

# Блок on указывает, когда должен запускаться скрипт
on:
  push:
    branches: [ "main" ] # Запуск при пуше в ветку main
  workflow_dispatch:       # Позволяет запускать сборку вручную через кнопку в GitHub Actions

jobs:
  build:
    name: Build and Sign APK
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код из твоего репозитория
      - name: Checkout project sources
        uses: actions/checkout@v4

      # 2. Настраиваем Java (версия 17 обычно используется в современных проектах)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle' # Включаем кэширование Gradle, чтобы следующие сборки шли быстрее

      # 3. Выдаем права на выполнение скрипта сборки
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 3.1. Создаем google-services.json из секрета
      - name: Create google-services.json
        env:
          GOOGLE_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_JSON" > app/google-services.json

      # 4. Собираем релизный APK (без подписи)
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # 5. Подписываем APK ключом, используя твои секреты из настроек репозитория
      - name: Sign Release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.KEYSTORE_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      # 6. Загружаем готовый файл, чтобы ты мог его скачать
      - name: Upload Signed APK
        uses: actions/upload-artifact@v5
        with:
          name: Signed-Release-APK
          # Экшен подписи сам знает точный путь к финальному файлу и передает его сюда
          path: ${{steps.sign_app.outputs.signedReleaseFile}}